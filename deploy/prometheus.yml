# Used by the optional monitoring profile of docker-compose.yml.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "ludexis-backend"
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - node-exporter:9100
