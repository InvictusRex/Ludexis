name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: ludexis
          POSTGRES_PASSWORD: ludexis
          POSTGRES_DB: ludexis_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://ludexis:ludexis@localhost:5432/ludexis_ci

      REDIS_URL: redis://localhost:6379/0

      CELERY_BROKER_URL: redis://localhost:6379/0

      CELERY_RESULT_BACKEND: redis://localhost:6379/0

      JWT_SECRET_KEY: github-actions-secret

      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 60

      JOB_MAX_RETRIES: 5
      JOB_RETRY_BACKOFF_MAX: 300

      TWITCH_CLIENT_ID: test
      TWITCH_CLIENT_SECRET: test

      ARTWORK_STORAGE_PATH: ./artwork

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest -v
