name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

  # Pushes to main and release tags run these checks from the image workflow, before anything is published.
  workflow_call:

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same major version as the frontend image.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # The image's build settings: relative API and media URLs behind the bundled proxy.
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_MEDIA_URL: /media
        run: npm run build
